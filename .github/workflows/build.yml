name: Queue Linux verification
on:
  workflow_dispatch:
    inputs:
      pr:
        required: false
        type: string
permissions:
  contents: read
jobs:
  queue-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build production queue and memory helpers; verify guards and call counts
        run: bash verification/queue-linux-verify.sh
